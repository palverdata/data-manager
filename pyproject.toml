[tool.poetry]
name = "data-manager"
version = "0.2.1"
description = ""
authors = ["Giancarlo Rocha <giancarloiff@gmail.com>"]
readme = "README.md"
packages = [{include = "data_manager"}]

[tool.poetry.dependencies]
python = "^3.8"
mongoflex = "^0.2.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.0"


[tool.poetry.group.dev.dependencies]
pytest-cov = "^4.1.0"
pytest = "^7.4.0"
ruff = "^0.0.284"
ipykernel = "^6.25.1"
tox = "^4.10.0"
commitizen = "^3.6.0"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
